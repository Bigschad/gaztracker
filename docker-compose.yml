version: '3.8'

services:
  # =============================================================================
  # GazTracker FastAPI Application
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaztracker_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./alembic:/app/alembic
    networks:
      - gaztracker_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # React Frontend (Back Office)
  # =============================================================================
  frontend:
    build:
      context: ./backoffice-web
      dockerfile: Dockerfile
    container_name: gaztracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - gaztracker_network
    depends_on:
      - app
    # VITE_API_URL laissé vide pour utiliser des URLs relatives via nginx proxy
    # En production, nginx proxy les requêtes /api vers le backend

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: gaztracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaztracker_db
      POSTGRES_USER: gaztracker_user
      POSTGRES_PASSWORD: your_secure_password_here
      PGDATA: /var/lib/postgresql/data/pgdata
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gaztracker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaztracker_user -d gaztracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis Cache & Session Store
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: gaztracker_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gaztracker_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =============================================================================
  # PgAdmin (Optional - Database Management UI)
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gaztracker_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gaztracker.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - gaztracker_network
    depends_on:
      - postgres

  # =============================================================================
  # Redis Commander (Optional - Redis Management UI)
  # =============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: gaztracker_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - gaztracker_network
    depends_on:
      - redis

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  gaztracker_network:
    driver: bridge
