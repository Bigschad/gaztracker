name: Deploy to Lightsail

on:
  push:
    # branches:
      # - main
      # - develop
    tags:
      - 'devfast'  # Tag pour déploiement rapide en production
  workflow_dispatch: # Permet le déclenchement manuel

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  deploy:
    name: Deploy to Lightsail Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set environment based on branch or tag
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/devfast" ]]; then
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/opt/gaztracker" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/opt/gaztracker" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=recette" >> $GITHUB_ENV
            echo "DEPLOY_PATH=/opt/gaztracker-recette" >> $GITHUB_ENV
          fi
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment package
        run: |
          # Utiliser git archive pour créer une archive propre
          # git archive respecte automatiquement .gitignore
          # Pour les exclusions supplémentaires, on utilise tar avec --exclude-from
          echo "📦 Création de l'archive de déploiement..."
          
          # Créer un fichier temporaire avec les exclusions
          cat > /tmp/exclude_patterns << 'EOF'
          node_modules/
          backoffice-web/node_modules/
          backoffice-web/dist/
          backoffice-web/.vite/
          *.pyc
          __pycache__/
          .env.local
          .env.docker
          *.log
          .pytest_cache/
          .coverage/
          htmlcov/
          .DS_Store
          Thumbs.db
          *.tmp
          *.swp
          *.swo
          key/
          uploads/
          logs/
          .git/
          EOF
          
          # Créer l'archive avec git archive (sans exclusions - elles sont gérées par .gitignore)
          # Puis utiliser tar pour créer l'archive finale avec exclusions
          git archive --format=tar HEAD | \
            tar --exclude-from=/tmp/exclude_patterns \
                --exclude='.git' \
                -czf deploy.tar.gz -
          
          # Alternative: utiliser directement tar si git archive pose problème
          # tar -czf deploy.tar.gz \
          #   --exclude-from=/tmp/exclude_patterns \
          #   --exclude='.git' \
          #   .
          
          # Nettoyer le fichier temporaire
          rm -f /tmp/exclude_patterns
          
          # Vérifier que l'archive a été créée
          if [ ! -f deploy.tar.gz ]; then
            echo "❌ Erreur: l'archive n'a pas été créée"
            exit 1
          fi
          
          # Afficher la taille de l'archive
          echo "✅ Archive créée:"
          ls -lh deploy.tar.gz
      
      - name: Upload to server
        run: |
          scp -i ~/.ssh/lightsail_key \
            -o StrictHostKeyChecking=no \
            deploy.tar.gz \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/tmp/
      
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/lightsail_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'ENDSSH'
          
          set -e
          
          # Variables
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          ENV="${{ env.ENVIRONMENT }}"
          
          echo "🚀 Déploiement de GazTracker - Environnement: $ENV"
          
          # Créer le répertoire si nécessaire
          sudo mkdir -p $DEPLOY_PATH
          sudo chown -R $USER:$USER $DEPLOY_PATH
          
          # Backup de la configuration actuelle
          if [ -f "$DEPLOY_PATH/.env" ]; then
            cp $DEPLOY_PATH/.env /tmp/.env.backup
            cp $DEPLOY_PATH/.env.docker /tmp/.env.docker.backup
          fi
          
          if [ -f "$DEPLOY_PATH/docker-compose.yml" ]; then
            cp $DEPLOY_PATH/docker-compose.yml /tmp/docker-compose.yml.backup
          fi

          # Extraire la nouvelle version
          cd $DEPLOY_PATH
          tar -xzf /tmp/deploy.tar.gz
          
          # Restaurer la config
          if [ -f "/tmp/.env.backup" ]; then
            cp /tmp/.env.backup $DEPLOY_PATH/.env
            cp /tmp/.env.docker.backup $DEPLOY_PATH/.env.docker
          fi
          
          if [ -f "/tmp/docker-compose.yml.backup" ]; then
            cp /tmp/docker-compose.yml.backup $DEPLOY_PATH/docker-compose.yml
          fi
          
          # Nettoyer
          rm /tmp/deploy.tar.gz
          
          # Arrêter les containers existants
          echo "⏹️  Arrêt des containers..."
          sudo docker-compose down || true
          
          # Build et démarrage
          echo "🔨 Build des images Docker..."
          sudo docker-compose build --no-cache
          
          echo "▶️  Démarrage des containers..."
          sudo docker-compose up -d
          
          # Attendre que les services soient prêts
          echo "⏳ Attente du démarrage des services..."
          sleep 15
          
          # Vérifier si la base de données est prête
          echo "🔍 Vérification de la connexion à la base de données..."
          for i in {1..30}; do
            if sudo docker-compose exec -T app python -c "from app.database import db_manager; db_manager.init_db(); print('OK')" 2>/dev/null; then
              echo "✅ Base de données accessible"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "⚠️  Base de données non accessible après 30 tentatives"
            else
              echo "   Tentative $i/30..."
              sleep 2
            fi
          done
          
          # Gérer les migrations problématiques (add_missing_tables)
          echo "🔧 Vérification des migrations problématiques..."
          if sudo docker-compose exec -T app test -f scripts/remove_problematic_migration.sh; then
            echo "   Script de correction disponible"
            # Ne pas exécuter automatiquement, juste informer
            echo "   💡 Si erreur 'type already exists', exécuter: bash scripts/remove_problematic_migration.sh"
          fi
          
          # Exécuter les migrations Alembic
          echo "🔄 Exécution des migrations Alembic..."
          if sudo docker-compose exec -T app alembic upgrade heads; then
            echo "✅ Migrations appliquées avec succès!"
            # Afficher l'état actuel
            echo "📊 État actuel des migrations:"
            sudo docker-compose exec -T app alembic current || true
          else
            echo "⚠️  Erreur lors des migrations"
            echo "📋 Logs des migrations:"
            sudo docker-compose logs app | grep -i "alembic\|migration" | tail -20 || true
            echo "💡 Si erreur 'type already exists', exécuter sur le serveur:"
            echo "   bash scripts/remove_problematic_migration.sh"
            echo "   docker-compose exec app alembic upgrade heads"
            # Ne pas faire échouer le déploiement pour une erreur de migration
            # L'utilisateur peut corriger manuellement
          fi
          
          # Vérifier l'état
          echo "✅ Vérification de l'état des services..."
          sudo docker-compose ps
          
          # Afficher les logs des services
          echo "📋 Logs des services:"
          sudo docker-compose logs --tail=20
          
          # Nettoyage des images inutilisées
          echo "🧹 Nettoyage..."
          sudo docker system prune -f
          
          echo "✨ Déploiement terminé avec succès!"
          ENDSSH
      
      - name: Health check
        run: |
          echo "🔍 Vérification de l'état de l'API..."
          
          # Attendre un peu plus longtemps pour que l'API soit prête
          echo "⏳ Attente du démarrage complet de l'API (30 secondes)..."
          sleep 30
          
          # Vérifier depuis l'intérieur du container d'abord (plus fiable)
          echo "🔍 Vérification interne (depuis le container)..."
          ssh -i ~/.ssh/lightsail_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'HEALTHCHECK'
          
          cd ${{ env.DEPLOY_PATH }}
          
          # Vérifier que le container est en cours d'exécution
          if ! sudo docker-compose ps app | grep -q "Up"; then
            echo "⚠️  Container app n'est pas en cours d'exécution"
            echo "📋 Logs du container:"
            sudo docker-compose logs --tail=50 app
            exit 1
          fi
          
          # Vérifier depuis l'intérieur du container
          MAX_RETRIES=10
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if sudo docker-compose exec -T app curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ API répond correctement depuis l'intérieur du container"
              SUCCESS=true
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "   Tentative $RETRY_COUNT/$MAX_RETRIES..."
            sleep 3
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "⚠️  API ne répond pas depuis l'intérieur du container"
            echo "📋 Logs du container app:"
            sudo docker-compose logs --tail=50 app
            echo ""
            echo "💡 L'API peut être en cours de démarrage. Vérifiez manuellement:"
            echo "   docker-compose logs app"
            echo "   docker-compose exec app curl http://localhost:8000/health"
            # Ne pas faire échouer le déploiement pour development
            if [[ "${{ env.ENVIRONMENT }}" == "development" ]]; then
              echo "⚠️  Health check échoué mais déploiement continué (environment: development)"
              exit 0
            else
              exit 1
            fi
          fi
          
          # Essayer de vérifier depuis l'extérieur (optionnel)
          echo "🔍 Vérification externe (depuis l'extérieur)..."
          EXTERNAL_URL="http://${{ secrets.LIGHTSAIL_HOST }}:8000/health"
          response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 $EXTERNAL_URL 2>/dev/null || echo "000")
          
          if [ "$response" == "200" ]; then
            echo "✅ API accessible depuis l'extérieur (HTTP $response)"
          else
            echo "⚠️  API non accessible depuis l'extérieur (HTTP $response)"
            echo "💡 Cela peut être normal si le port 8000 n'est pas exposé publiquement"
            echo "   L'API fonctionne depuis l'intérieur du container"
          fi
          
          HEALTHCHECK
          
          echo "✅ Health check terminé"
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/lightsail_key
          rm -f deploy.tar.gz
      
      - name: Notification on success
        if: success()
        run: |
          echo "✅ Déploiement réussi sur ${{ env.ENVIRONMENT }}"
          echo "🔗 Backend API: http://${{ secrets.LIGHTSAIL_HOST }}:8000"
          echo "🔗 Frontend: http://${{ secrets.LIGHTSAIL_HOST }}"
          echo "📚 Documentation API: http://${{ secrets.LIGHTSAIL_HOST }}:8000/docs"
          echo ""
          echo "💡 En cas d'erreur de migration 'type already exists':"
          echo "   ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}"
          echo "   cd ${{ env.DEPLOY_PATH }}"
          echo "   bash scripts/remove_problematic_migration.sh"
          echo "   docker-compose exec app alembic upgrade heads"
      
      - name: Notification on failure
        if: failure()
        run: |
          echo "❌ Le déploiement a échoué"
          echo "Vérifiez les logs ci-dessus pour plus de détails"

