services:
  # Backend API (utilise le service app du docker-compose principal)
  # Note: Ce fichier doit être utilisé depuis le dossier parent avec:
  # docker-compose -f docker-compose.yml -f mobile-app/docker-compose.mobile.yml up
  # OU utiliser directement le docker-compose.yml principal

  # Expo Dev Server (optionnel - pour développement)
  expo-dev:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: gaztracker-expo-dev
    ports:
      - "19000:19000"  # Expo
      - "19001:19001"  # Metro bundler
      - "19002:19002"  # Expo DevTools
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    networks:
      - mobile-network
    command: npm start
    profiles:
      - dev  # Ne démarre que si --profile dev est spécifié

volumes:
  postgres_mobile_data:

networks:
  mobile-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

